[project]
name = "domain-interview-bot"
version = "0.1.0"
description = "A Telegram bot for conducting structured domain interviews and collecting software requirements."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Max Shouman", email = "88464001+maxshouman@users.noreply.github.com" }
]
dependencies = []

[project.scripts]
domain-interview-bot = "domain_interview_bot:main"

[project.urls]
Repository = "https://github.com/maxshouman/domain-interview-bot"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "UP",
    "RUF",
]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unused_configs = true
show_error_codes = true

[tool.pytest]
minversion = "9.0"
addopts = ["-ra"]
testpaths = ["tests"]
